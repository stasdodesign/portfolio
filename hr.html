<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HR - UI Components</title>
    <link rel="stylesheet" href="css/styles.css">
	<link rel="stylesheet" href="css/hr.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
<body>

  <!-- Главное меню -->
  <header class="main-header">
    <div class="logo">
      <svg class="logo-img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor">
        <circle cx="50" cy="50" r="40" />
        <text x="50%" y="55%" text-anchor="middle" fill="#fff" font-size="50" dy=".25em">S</text>
      </svg>
      <div class="logo-text">
        <span class="logo-title">STAS</span>
        <span class="logo-subtitle">Product Design System</span>
      </div>
    </div>
    <nav class="main-nav">
      <a href="themes.html" class="nav-link">Themes</a>
      <a href="primitives.html" class="nav-link">Primitives</a>
      <a href="type.html" class="nav-link">Type</a>
      <a href="colors.html" class="nav-link active">Colors</a>
      <a href="icons.html" class="nav-link">Icons</a>
    </nav>
    <button class="burger" id="burger-btn">☰</button>
    <div class="extra-menu">
      <a href="https://github.com/stasdodesign/portfolio" class="menu-link">GitHub</a>
    </div>
  </header>
  <div class="overlay" id="overlay"></div>

  
  <!-- Второе меню - Якоря -->
  <aside class="sub-nav">
    <ul>
      <li><a href="#Trigger">Trigger</a></li>
    </ul>
  </aside>

  <!-- Компоненты -->
  <main class="components-list">

    <!-- Trigger -->
    <section id="Trigger" class="component-section">
      <h1>HR</h1>
      
<div class="max-w-2xl mx-auto p-6 bg-white rounded-2xl shadow-lg space-y-6">
  <h2 class="text-2xl font-bold">Создание триггера события</h2>

  <div class="space-y-4">
    <!-- Тип события -->
    <div>
      <label class="block text-sm font-medium mb-1">Тип события</label>
      <select class="w-full border rounded-lg p-2">
        <option>Выберите событие</option>
        <option>Окончание испытательного срока</option>
        <option>Постановка годовых целей</option>
        <option>Согласование отпуска</option>
      </select>
    </div>

    <!-- Условие срабатывания -->
    <div>
      <label class="block text-sm font-medium mb-1">Условие срабатывания</label>
      <div class="flex space-x-2">
        <input type="date" class="flex-1 border rounded-lg p-2" placeholder="Дата">
        <input type="number" class="w-28 border rounded-lg p-2" placeholder="+30 дней">
      </div>
    </div>

    <!-- Ответственные -->
    <div>
      <label class="block text-sm font-medium mb-1">Кому отправить уведомление</label>
      <input type="text" class="w-full border rounded-lg p-2" placeholder="Выберите сотрудников или роли">
    </div>

    <!-- Способ уведомления -->
    <div>
      <label class="block text-sm font-medium mb-1">Способ уведомления</label>
      <div class="flex space-x-3">
        <label class="flex items-center space-x-2">
          <input type="checkbox" class="rounded border-gray-300">
          <span>В системе</span>
        </label>
        <label class="flex items-center space-x-2">
          <input type="checkbox" class="rounded border-gray-300">
          <span>По почте</span>
        </label>
        <label class="flex items-center space-x-2">
          <input type="checkbox" class="rounded border-gray-300">
          <span>В мессенджере</span>
        </label>
      </div>
    </div>

    <!-- Текст уведомления -->
    <div>
      <label class="block text-sm font-medium mb-1">Текст уведомления</label>
      <textarea class="w-full border rounded-lg p-2" rows="4" placeholder="Введите текст уведомления с переменными..."></textarea>
    </div>

    <!-- Статус -->
    <div class="flex items-center space-x-2">
      <input type="checkbox" class="rounded border-gray-300" checked>
      <span>Активный триггер</span>
    </div>

    <!-- Кнопки -->
    <div class="flex justify-end space-x-4">
      <button class="btn-primary px-4 py-2 rounded-lg bg-gray-200 text-gray-700 hover:bg-gray-300">Отмена</button>
      <button class="btn-primary px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700">Сохранить триггер</button>
    </div>

  </div>
</div>

</section>


  </main>

  <script src="js/modal.js"></script>
  <script src="js/tabs.js"></script>
  <script src="js/accordion.js"></script>
  <script src="js/burger.js"></script>

</body>
</html>
