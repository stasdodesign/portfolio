<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Центр ПО</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 to-slate-800 text-white flex flex-col items-center p-6">

  <header class="text-center mb-10">
    <h1 class="text-4xl font-bold mb-3">Центр Программного Обеспечения</h1>
    <p class="text-slate-300">Выберите и установите нужное приложение</p>
  </header>

  <!-- Панель поиска и фильтра -->
  <div class="flex flex-col sm:flex-row justify-center items-center gap-4 mb-10 w-full max-w-5xl">
    <input id="search" type="text" placeholder="Поиск ПО..."
           class="w-full sm:w-1/2 px-4 py-2 rounded-xl bg-slate-700 text-white placeholder-slate-400 outline-none focus:ring-2 focus:ring-indigo-500 transition" />
    <select id="category" class="w-full sm:w-1/3 px-4 py-2 rounded-xl bg-slate-700 text-white outline-none focus:ring-2 focus:ring-indigo-500 transition">
      <option>Все</option>
      <option>Инструменты разработки</option>
      <option>Локальное офисное ПО</option>
      <option>Базовое ПО</option>
      <option>Системное ПО</option>
      <option>ПО кибербезопасности</option>
      <option>ПО для дизайнеров</option>
      <option>ПО технической безопасности</option>
      <option>Автоматизированное проектирование</option>
      <option>Клиентские части АС</option>
      <option>Инструменты администраторов</option>
      <option>Библиотеки DS</option>
      <option>Служебные пакеты ПО</option>
    </select>
  </div>

  <!-- Контейнер карточек -->
  <div id="cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 w-full max-w-6xl"></div>

  <!-- Модальное окно установки -->
  <div id="modal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 hidden">
    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-80 text-center">
      <h3 id="modal-name" class="text-2xl font-semibold mb-4"></h3>
      <p class="text-slate-300 mb-6">Устанавливается...</p>
      <div class="w-full bg-slate-700 rounded-full h-3 overflow-hidden">
        <div id="progress-bar" class="bg-indigo-500 h-3 w-0"></div>
      </div>
      <p id="progress-text" class="text-sm text-slate-400 mt-3">0%</p>
    </div>
  </div>

  <footer class="mt-16 text-slate-500 text-sm">© 2025 Центр ПО. Все права защищены.</footer>

  <script>
    const software = [
      {name:"CodeMaster IDE", description:"Среда разработки для Python, C++ и Java.", version:"v3.2.1", category:"Инструменты разработки"},
      {name:"SafeGuard", description:"Комплекс защиты сети и устройств.", version:"v2.0.1", category:"ПО кибербезопасности"},
      {name:"DesignLab", description:"Инструмент для проектирования и графики.", version:"v1.6.4", category:"ПО для дизайнеров"},
      {name:"SysManager", description:"Утилита администрирования систем.", version:"v5.0.0", category:"Инструменты администраторов"}
    ];

    const cardsContainer = document.getElementById("cards");
    const searchInput = document.getElementById("search");
    const categorySelect = document.getElementById("category");
    const modal = document.getElementById("modal");
    const modalName = document.getElementById("modal-name");
    const progressBar = document.getElementById("progress-bar");
    const progressText = document.getElementById("progress-text");

    function renderCards() {
      const search = searchInput.value.toLowerCase();
      const category = categorySelect.value;
      cardsContainer.innerHTML = "";
      const filtered = software.filter(app => 
        (category === "Все" || app.category === category) &&
        app.name.toLowerCase().includes(search)
      );
      if(filtered.length === 0){
        cardsContainer.innerHTML = '<p class="text-slate-400 text-center col-span-full">Ничего не найдено</p>';
      }
      filtered.forEach(app => {
        const card = document.createElement("div");
        card.className = "bg-slate-800 rounded-2xl shadow-lg hover:shadow-2xl transition-all duration-300 p-6 flex flex-col justify-between transform hover:scale-105";
        card.innerHTML = `
          <div>
            <h2 class="text-2xl font-semibold mb-2">${app.name}</h2>
            <p class="text-slate-400 mb-4">${app.description}</p>
          </div>
          <div class="flex justify-between items-center">
            <span class="text-sm text-slate-500">${app.version}</span>
            <button class="bg-indigo-500 hover:bg-indigo-600 transition-colors px-4 py-2 rounded-xl text-sm font-medium">Установить</button>
          </div>
        `;
        card.querySelector("button").onclick = () => startInstall(app);
        cardsContainer.appendChild(card);
      });
    }

    function startInstall(app){
      modalName.textContent = app.name;
      modal.classList.remove("hidden");
      let progress = 0;
      progressBar.style.width = "0%";
      progressText.textContent = "0%";
      const interval = setInterval(()=>{
        progress += 5;
        if(progress>100) progress=100;
        progressBar.style.width = progress+"%";
        progressText.textContent = progress+"%";
        if(progress>=100){
          clearInterval(interval);
          setTimeout(()=> modal.classList.add("hidden"), 1000);
        }
      },150);
    }

    searchInput.addEventListener("input", renderCards);
    categorySelect.addEventListener("change", renderCards);

    renderCards();
  </script>
</body>
</html>
